<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squid Wiki</title>
  <meta name="description" content="一只多触手的鱿鱼 | Grid 能源 · Game 游戏 · Gain 理财">
  <style>
    :root { --bg:#faf8fc; --fg:#1f1a24; --muted:#6b6375; --card:#fff; --line:#e6e0ec; --accent:#9b7fd1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#16131a; --fg:#eee9f3; --muted:#a79fb1; --card:#211d27; --line:#332d3b; --accent:#b9a2e6; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width: 960px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 2.4rem; margin: 0 0 8px; }
    p.lead { color: var(--muted); margin: 0 0 40px; }
    .grid { display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    a.card { display:block; padding:24px; border:1px solid var(--line); border-radius:14px; background:var(--card); color:inherit; text-decoration:none; transition: border-color .15s, transform .15s; }
    a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h2 { margin:0 0 6px; font-size:1.3rem; }
    .card p { margin:0; color:var(--muted); font-size:.95rem; line-height:1.5; }
    footer { margin-top:48px; color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>🦑 Squid Wiki</h1>
    <p class="lead">一只多触手的鱿鱼 —— Grid 能源 · Game 游戏 · Gain 理财</p>
    <div class="grid">
      <a class="card" href="https://energy.squid.wiki"><h2>⚡ Grid · 能源</h2><p>IoT、HES、MDM、预付费，DLMS / DL/T 645 / ANSI C12 / STS 协议笔记</p></a>
      <a class="card" href="https://game.squid.wiki"><h2>🎮 Game · 游戏</h2><p>宝可梦火红攻略，第三世代闪光与个体值计算器</p></a>
      <a class="card" href="https://finance.squid.wiki"><h2>📈 Gain · 理财</h2><p>美股、黄金、红利、BTC，年化收益计算器</p></a>
    </div>
    <footer>© 2026 Squid Wiki · 内容采用 CC BY-NC-SA 4.0</footer>
  </main>
</body>
</html>
